services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: culturequizz
      MYSQL_USER: quizz
      MYSQL_PASSWORD: quizz
    ports:
      # Port 3307 côté machine car un MySQL local peut déjà utiliser 3306 sous Windows.
      # Dans Docker, l'API joint toujours MySQL sur db:3306.
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # 127.0.0.1 force le TCP : le test ne passe que quand MySQL est vraiment prêt
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: culturequizz
      DB_USERNAME: quizz
      DB_PASSWORD: quizz
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
    volumes:
      # Rechargement à chaud : on modifie un fichier sous Windows, l'API redémarre seule
      - ./api:/srv
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  mysql_data:
