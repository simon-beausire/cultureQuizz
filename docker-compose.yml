services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: culturequizz
      MYSQL_USER: quizz
      MYSQL_PASSWORD: quizz
    ports:
      # Host port 3307 because a local MySQL may already use 3306 on Windows.
      # Inside Docker, the API still reaches MySQL on db:3306.
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # 127.0.0.1 forces TCP, so the check only passes once MySQL is really ready
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: culturequizz
      DB_USERNAME: quizz
      DB_PASSWORD: quizz
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
    volumes:
      # Live code reload: edit a file on Windows, the API restarts by itself
      - ./api:/srv
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  mysql_data:
